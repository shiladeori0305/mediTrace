<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MediTrace — Document Processing Agent</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px; }
    input[type=file] { margin: 12px 0; }
    button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
    .hint { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>MediTrace — Document Processing Agent</h1>
  <p class="hint">Upload a prescription/report (PDF, JPG, JPEG, PNG). This module only extracts <b>candidate facts</b> — nothing here is verified.</p>

  <div class="card">
    <form id="uploadForm">
      <input type="file" id="fileInput" name="file" accept=".pdf,.jpg,.jpeg,.png" required />
      <br />
      <button type="submit">Upload &amp; Process</button>
    </form>
  </div>

  <div class="card">
    <strong>Result</strong>
    <pre id="result">No document processed yet.</pre>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const resultBox = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      resultBox.textContent = 'Processing... this can take a few seconds for OCR.';

      try {
        const res = await fetch('/process', { method: 'POST', body: formData });
        const data = await res.json();
        resultBox.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultBox.textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
